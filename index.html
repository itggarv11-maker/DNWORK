    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* slate-950 */
        color: #f8fafc;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
      }

      /* Global 3D Hover Effect */
      .interactive-3d {
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .interactive-3d:hover {
        transform: translateY(-4px) scale(1.01);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Animation Utilities */
      .animate-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* --- GOD LEVEL ATOM ANIMATIONS --- */
      .atom-container {
        position: relative;
        width: 300px;
        height: 300px;
        perspective: 1000px;
        transform-style: preserve-3d;
      }
      .atom-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 30px #8b5cf6, 0 0 60px #4c1d95;
        z-index: 10;
      }
      .electron-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 50%;
        transform-style: preserve-3d;
      }
      .electron {
        position: absolute;
        top: -6px;
        left: 50%;
        width: 12px;
        height: 12px;
        background: #fbbf24;
        border-radius: 50%;
        box-shadow: 0 0 15px #fbbf24;
      }
      
      /* Specific Ring Rotations */
      .ring-1 {
        transform: translate(-50%, -50%) rotateX(70deg) rotateY(10deg);
        animation: spin1 3s linear infinite;
      }
      .ring-2 {
        transform: translate(-50%, -50%) rotateX(70deg) rotateY(130deg);
        animation: spin2 4s linear infinite;
      }
      .ring-3 {
        transform: translate(-50%, -50%) rotateX(70deg) rotateY(250deg);
        animation: spin3 5s linear infinite;
      }

      @keyframes spin1 {
        0% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(10deg) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(10deg) rotateZ(360deg); }
      }
      @keyframes spin2 {
        0% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(130deg) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(130deg) rotateZ(360deg); }
      }
      @keyframes spin3 {
        0% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(250deg) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) rotateX(70deg) rotateY(250deg) rotateZ(360deg); }
      }

      /* --- BACKGROUND GRID PATTERN --- */
      .bg-grid-slate {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='rgb(30 41 59 / 0.5)'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e");
      }
      
      /* Text Gradient Animation */
      @keyframes text-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-text-gradient {
        background-size: 200% 200%;
        animation: text-gradient 4s ease infinite;
      }
    </style>
